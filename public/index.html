<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14305f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Espais electorals · Selección de espacios electorales</title>
<style>
:root{
  --bg:#f2f4f8; --panel:#fff; --ink:#1a2333; --ink2:#44526a; --mute:#6c7a90; --line:#dbe1ea; --line2:#eceff5;
  --brand:#14305f; --brand2:#264d92; --brand-ink:#fff; --focus:#2b6df0;
  --ok:#17874d; --warn:#a96300; --bad:#c0262d; --bad-bg:#fdecec; --ok-bg:#e6f5ec; --warn-bg:#fff3dc; --info-bg:#e9f0fd;
  --wknd:rgba(20,48,95,.045); --today:#c0262d;
  --r:8px; --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.07);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;line-height:1.2}
small{color:var(--mute)}
.muted{color:var(--mute)}
.nowrap{white-space:nowrap}

/* ---------- botones y campos ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--ink);transition:background .12s,border-color .12s}
.btn:hover{background:#f3f6fb;border-color:#c5cfdd}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand2);border-color:var(--brand2)}
.btn.danger{color:var(--bad);border-color:#efc4c6}
.btn.danger:hover{background:var(--bad-bg)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field>span,.lbl{font-size:12px;font-weight:600;color:var(--ink2)}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=tel],input[type=email],input[type=time],input[type=search],select,textarea{width:100%;border:1px solid #cdd5e1;border-radius:6px;padding:7px 9px;background:#fff;min-height:34px}
textarea{resize:vertical;min-height:70px}
input:disabled,select:disabled,textarea:disabled{background:#f4f6f9;color:var(--mute)}
.chk{display:flex;align-items:flex-start;gap:8px;margin:8px 0;font-size:13px}
.chk input{margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12.5px;color:var(--ink2);background:var(--info-bg);border-radius:6px;padding:8px 10px;margin:4px 0 10px;min-height:20px}
.hint.warn{background:var(--warn-bg);color:#6a4200}
.hint.err{background:var(--bad-bg);color:#8a1b20}
.seg{display:flex;border:1px solid #cdd5e1;border-radius:7px;overflow:hidden;background:#fff}
.seg label,.seg button{flex:1;text-align:center;padding:7px 10px;font-size:13px;font-weight:600;border:0;background:#fff;cursor:pointer;color:var(--ink2);border-right:1px solid #e1e6ee}
.seg>*:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label.on,.seg button.on{background:var(--brand);color:#fff}

/* ---------- cabecera ---------- */
.top{background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-size:19px;letter-spacing:.3px;display:block;line-height:1.1}
.brand span{font-size:12px;opacity:.78;display:block}
.top select{width:auto;min-width:220px;max-width:320px;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.28);font-weight:600}
.top select option{color:#111}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff}
.pill i{width:8px;height:8px;border-radius:50%;background:#aab4c6;display:inline-block}
.pill.ok i{background:#4ade80}.pill.pend i{background:#facc15}.pill.err i{background:#f87171}.pill.loc i{background:#fb923c}
.top .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.28)}
.top .btn:hover{background:rgba(255,255,255,.22)}
.who{font-size:13px;opacity:.92;display:flex;align-items:center;gap:6px}
.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 14px;font-weight:600;font-size:13.5px;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.banner{display:flex;align-items:center;gap:12px;padding:9px 20px;font-size:13px;background:var(--warn-bg);color:#5d3a00;border-bottom:1px solid #f0d9a8;flex-wrap:wrap}
.banner.info{background:var(--info-bg);color:#17356b;border-color:#c9d9f6}
.banner.err{background:var(--bad-bg);color:#7e1a1f;border-color:#f0c2c4}
.banner b{font-weight:700}
.banner .btn{margin-left:auto}

.procbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.procbar h1{font-size:18px}
.procbar .kv{display:flex;flex-direction:column;font-size:12px;color:var(--mute)}
.procbar .kv b{font-size:14px;color:var(--ink);font-weight:700}
.procbar .prog{margin-left:auto;min-width:200px}
.meter{height:8px;background:#e7ebf2;border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.procbar .prog small{display:block;margin-bottom:4px}

main{padding:16px 20px 60px;max-width:1500px;margin:0 auto}
.tools{padding:12px 20px 0;max-width:1500px;margin:0 auto}
.tools .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input[type=search]{width:260px;border:1px solid #cdd5e1;border-radius:6px;padding:7px 10px;min-height:34px}
.tools select{width:auto}
.tools .chk{margin:0;font-size:13px;align-items:center}
.tools .chk input{margin:0}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.lg{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px 2px 4px;font-size:12px;display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600}
.lg i{width:14px;height:14px;border-radius:50%;background:var(--c);display:inline-block}
.lg.on{border-color:var(--brand);background:var(--info-bg);color:var(--brand)}
.lg:hover{border-color:#b8c3d4}
.count{font-size:12.5px;color:var(--mute);margin-left:auto}

.chip{display:inline-block;background:var(--c);color:var(--t);padding:1px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1.6}

/* ---------- tarjetas / resumen ---------- */
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px}
.card h3{font-size:14.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .n{background:var(--line2);color:var(--ink2);border-radius:99px;padding:0 8px;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:26px;line-height:1.1;letter-spacing:-.5px}
.kpi span{font-size:12px;color:var(--mute)}
.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
.hitos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.hito{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fbfcfe}
.hito b{display:block;font-size:12.5px}
.hito span{display:block;font-size:12.5px;color:var(--ink2)}
.hito small{font-size:11.5px}
.hito.past{opacity:.55}.hito.now{border-color:var(--brand);background:var(--info-bg)}
button.hito{text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
button.hito:hover{border-color:var(--brand);box-shadow:0 1px 6px rgba(20,48,95,.15)}
.hito.own{border-left:5px solid #F2C200;background:#fff8d6}.hito.own.now{background:#fff1b0;border-color:#d9ab00}
.hito .hix{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.ix{display:inline-block;font-size:11px;font-weight:600;color:var(--ink2);background:#eef2f8;border-radius:10px;padding:0 6px;margin-left:5px;white-space:nowrap;vertical-align:middle;line-height:1.6}
.ix.resp{background:#f3f0fa;color:#4b3a78;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.hit .ix,.hix .ix{margin-left:0}
.hmk{color:#b38600;font-weight:700;margin-right:5px}
.mtabs{display:flex;flex-wrap:wrap;max-width:none}.mtabs button small{opacity:.7;font-weight:400}
.pchips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.gtbl{border-collapse:separate;border-spacing:0}
.gtbl th{font-size:11px;white-space:nowrap;padding:4px 6px;text-align:center}
.gtbl .gsticky{position:sticky;left:0;z-index:2;background:#f6f8fb;text-align:left;min-width:190px;max-width:240px;white-space:normal}
.gtbl td.gc{padding:2px;min-width:86px}
.gtbl td.gc input{min-height:28px;padding:3px 5px;font-size:12px;border-color:#dde3ec}
.g-as,.gtbl td.g-as input{background:#e3edfb!important}.g-nd,.gtbl td.g-nd input{background:#e6e7ea!important;color:#555}.g-rs,.gtbl td.g-rs input{background:#fff1cc!important}
.resf{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.seg.segsm button{font-size:12px;padding:5px 10px}
.reslist{max-height:560px}
.resrow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line2)}
.resrow .mini{border-bottom:0;flex:1;min-width:0}
.resrow .resst{flex:none}
.resrow.closed .mini{opacity:.55}
.btn.hbtn{background:#F2C200;border-color:#d9ab00;color:#3b2f00;font-weight:700}.btn.hbtn:hover{background:#ffd633}
.ag-e.hb{border-left:5px solid #F2C200;background:#fff8d6}
.sc.hb{border-left:5px solid #F2C200!important;background:#fff8d6}.sc.hb .sc-h{background:#fff8d6}
.bar.hb{--c:#F2C200!important;--t:#3b2f00!important;background:#F2C200;color:#3b2f00;box-shadow:inset 0 0 0 2px #b38600;font-weight:700}
.g-bar.hb{--c:#F2C200!important;background:#F2C200;box-shadow:0 0 0 2px #b38600}
.g-l .g-tt{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.g-l .ix{margin-left:2px;font-size:10px}
.hlist{max-height:240px;border:1px solid var(--line);border-radius:7px;padding:4px 8px;margin-top:6px}
.hlist .chk{margin:3px 0;align-items:flex-start}
.hlist .chk[hidden]{display:none}
.mini{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;padding:7px 4px;border-bottom:1px solid var(--line2);border-radius:0}
.mini:hover{background:#f5f8fd}
.mini:last-child{border-bottom:0}
.mini .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.mini .mt{flex:1;min-width:0;font-size:13px}
.mini .md{font-size:12px;color:var(--mute);white-space:nowrap;text-align:right}
.mini.bad .md{color:var(--bad);font-weight:700}
.scrolly{max-height:420px;overflow:auto}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.pad{padding:18px}

/* ---------- tabla de plazos ---------- */
.tblwrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:auto}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;background:#f6f8fc;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line);z-index:2;white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl tr.sec td{background:#eef2f8;font-weight:700;font-size:12.5px;color:var(--brand);cursor:pointer;position:sticky;top:33px;z-index:1;border-bottom:1px solid var(--line)}
.tbl tr.sec .cnt{font-weight:600;color:var(--mute);margin-left:8px}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:#f7faff}
.tbl tr.row.open td:first-child{box-shadow:inset 3px 0 0 var(--brand2)}
.tbl tr.row.overdue td{background:var(--bad-bg)}
.tbl tr.row.overdue td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.tbl tr.row.closed .tt{text-decoration:line-through;color:var(--mute)}
.tbl tr.row.closed td{opacity:.72}
.tbl tr.row.past:not(.closed):not(.overdue) .c-d b{color:var(--mute);font-weight:600}
.tt{font-weight:600;line-height:1.35}
.sub{font-size:12px;color:var(--mute);margin-top:1px}
.star{color:#d89a00;margin-right:4px}
.c-chk{width:34px;text-align:center}
.c-chk input{width:16px;height:16px;cursor:pointer}
.c-d{white-space:nowrap}
.c-d b{font-weight:700}
.c-d small{display:block;font-size:11.5px}
.c-plazo{max-width:230px;font-size:12px;color:var(--ink2)}
.c-resp{font-size:12.5px;max-width:130px}
.c-n{white-space:nowrap;font-size:12.5px;color:var(--mute)}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.st-p{background:#eceff5;color:#46536a}.st-c{background:#dfeafd;color:#1b4fb0}.st-h{background:var(--ok-bg);color:var(--ok)}.st-n{background:#f1ecf8;color:#6b4a9b}
.badge.late{background:var(--bad);color:#fff}

/* ---------- agenda ---------- */
.ag-day{margin-bottom:14px}
.ag-h{display:flex;align-items:baseline;gap:10px;padding:6px 2px;border-bottom:2px solid var(--line);margin-bottom:4px}
.ag-h b{font-size:15px}
.ag-h.today b{color:var(--today)}
.ag-h small{font-size:12.5px}
.ag-e{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;background:#fff;border:1px solid var(--line2);margin:4px 0;cursor:pointer}
.ag-e:hover{background:#f6f9ff}
.ag-e .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;min-width:84px;color:var(--ink2)}
.ag-e .k.end{color:var(--bad)}.ag-e .k.start{color:var(--ok)}
.ag-e .t{flex:1;min-width:0}
.ag-e.closed .t{text-decoration:line-through;color:var(--mute)}

/* ---------- calendario ---------- */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cal-head h2{font-size:18px;min-width:170px}
.cal{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:#f6f8fc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;text-transform:uppercase;color:var(--mute);letter-spacing:.4px}
.cal-dow div{padding:6px 8px;border-right:1px solid var(--line2)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);position:relative;min-height:92px;grid-auto-rows:min-content}
.wk:last-child{border-bottom:0}
.dbg{border-right:1px solid var(--line2);z-index:0}
.dbg.we{background:var(--wknd)}
.dbg.out{background:repeating-linear-gradient(135deg,#f4f6fa 0 6px,#eef1f6 6px 12px)}
.dbg.vote{background:#e8eefb;box-shadow:inset 0 0 0 2px #1a2a55}
.dnum{z-index:1;padding:3px 6px;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;display:flex;gap:6px;align-items:center;justify-self:stretch}
.dnum:hover{background:rgba(20,48,95,.06)}
.dnum em{font-style:normal;font-weight:600;font-size:10.5px;color:var(--mute)}
.dnum.out{color:#98a3b6}
.dnum.today span{background:var(--today);color:#fff;border-radius:99px;padding:0 6px}
.dnum.vote strong{font-size:10.5px;background:#1a2a55;color:#fff;border-radius:4px;padding:0 5px}
.bar{z-index:1;margin:1px 2px;padding:1px 6px;border:0;border-radius:4px;background:var(--c);color:var(--t);font-size:11.5px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;min-width:0}
.bar:hover{filter:brightness(.93);box-shadow:0 0 0 2px rgba(20,48,95,.35)}
.bar.cutL{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.bar.cutR{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.bar.closed{opacity:.45;text-decoration:line-through}
.bar.late{outline:2px solid var(--bad);outline-offset:-2px}
.more{z-index:1;border:0;background:none;font-size:11px;color:var(--brand2);font-weight:700;text-align:left;padding:0 8px}
.more:hover{text-decoration:underline}

/* ---------- cronograma ---------- */
.gscroll{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 260px);min-height:300px}
.gin{position:relative;width:max-content;min-width:100%;--lw:310px}
.g-hd{position:sticky;top:0;z-index:4;background:#f6f8fc;border-bottom:1px solid var(--line);display:flex}
.g-hl{position:sticky;left:0;z-index:5;width:var(--lw);flex:none;background:#f6f8fc;border-right:1px solid var(--line);padding:6px 10px;font-size:11.5px;font-weight:700;text-transform:uppercase;color:var(--mute)}
.g-hr{position:relative;flex:none}
.g-mo{display:flex;height:20px;border-bottom:1px solid var(--line2)}
.g-mo div{font-size:11px;font-weight:700;color:var(--ink2);padding:2px 6px;border-right:1px solid var(--line);overflow:hidden;white-space:nowrap}
.g-dy{display:flex;height:22px}
.g-dy div{font-size:10px;text-align:center;color:var(--mute);line-height:22px;flex:none;border-right:1px solid var(--line2)}
.g-dy div.we{background:var(--wknd)}
.g-dy div.d0{background:#dfe8fa;color:var(--brand);font-weight:700}
.g-dy div.dv{background:#1a2a55;color:#fff;font-weight:700}
.g-row{display:flex;border-bottom:1px solid var(--line2);height:27px}
.g-sec{display:flex;border-bottom:1px solid var(--line);background:#eef2f8;height:26px}
.g-l{position:sticky;left:0;z-index:3;width:var(--lw);flex:none;background:#fff;border-right:1px solid var(--line);padding:3px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px;cursor:pointer}
.g-l:hover{background:#f3f7ff}
.g-sec .g-l{background:#eef2f8;font-weight:700;color:var(--brand);cursor:default}
.g-l i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.g-t{position:relative;flex:none;background-repeat:repeat-x}
.g-bar{position:absolute;top:5px;height:17px;border-radius:4px;background:var(--c);min-width:6px;cursor:pointer;border:0;padding:0}
.g-bar.closed{opacity:.4}
.g-bar.late{outline:2px solid var(--bad)}
.g-guide{position:absolute;top:0;bottom:0;width:2px;z-index:2;pointer-events:none}
.g-guide.today{background:var(--today)}
.g-guide.vote{background:#1a2a55}

/* ---------- actividad / ajustes ---------- */
.act{display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line2);font-size:13px}
.act:last-child{border-bottom:0}
.act .av{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.act .when{font-size:11.5px;color:var(--mute)}
.set h3{font-size:15px}
.set p{margin:4px 0 10px;color:var(--ink2)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.plist{width:100%;border-collapse:collapse;font-size:13px}
.plist td,.plist th{padding:7px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
.plist th{font-size:11.5px;text-transform:uppercase;color:var(--mute);letter-spacing:.4px}
.tag{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--line2);color:var(--ink2)}
.tag.arch{background:#efe9f9;color:#5b3d92}

/* ---------- cajón lateral ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,24,42,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);background:#fff;z-index:50;box-shadow:-8px 0 30px rgba(15,24,42,.2);transform:translateX(104%);transition:transform .22s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{display:flex;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line);align-items:flex-start}
.dr-h h2{font-size:17px;line-height:1.3}
.dr-sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);font-weight:700;margin-bottom:3px}
.dr-meta{margin-top:7px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.x{margin-left:auto;border:0;background:none;font-size:20px;line-height:1;color:var(--mute);padding:2px 8px;border-radius:6px}
.x:hover{background:var(--line2);color:var(--ink)}
.dr-b{flex:1;overflow:auto;padding:14px 18px 20px}
.dr-b section{margin-bottom:18px}
.dr-b h4{margin:0 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute)}
.legal{background:#f6f8fc;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:13px}
.legal div+div{margin-top:4px}
.infonota{background:var(--warn-bg);border-radius:7px;padding:8px 11px;font-size:12.5px;color:#5d3a00}
.note{border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin-bottom:8px;background:#fdfdfe}
.note .nh{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute);margin-bottom:3px}
.note .nh b{color:var(--ink)}
.note .nh button{margin-left:auto;border:0;background:none;color:var(--mute);font-size:12px;padding:0 4px}
.note .nh button:hover{color:var(--bad);text-decoration:underline}
.note .nt{white-space:pre-wrap;word-break:break-word}
.starbtn{display:inline-flex;gap:7px;align-items:center;font-size:13px;cursor:pointer}

/* ---------- modales, aviso, bloqueo ---------- */
.modal{position:fixed;inset:0;background:rgba(15,24,42,.5);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto}
.mc{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(560px,100%);padding:20px 22px}
.mc.wide{width:min(720px,100%)}
.mc h2{font-size:18px;margin-bottom:12px}
.mc p{margin:0 0 10px;color:var(--ink2)}
.mc .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.daylist .mini{padding:8px 4px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#1a2333;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:all .25s;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--bad)}
.lock{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#10254a 0%,#1c3d78 60%,#2a5aa8 100%);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.lock .box{background:#fff;border-radius:14px;width:min(430px,100%);padding:28px 28px 22px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.lock .logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.lock .logo svg{width:44px;height:44px}
.lock .logo b{font-size:24px;letter-spacing:.4px;color:var(--brand);display:block;line-height:1}
.lock .logo span{font-size:12.5px;color:var(--mute)}
.lock .lead{color:var(--ink2);margin:10px 0 16px;font-size:13.5px}
.lock .err{background:var(--bad-bg);color:#8a1b20;padding:8px 10px;border-radius:6px;font-size:13px;margin-bottom:12px}
.lock .links{display:flex;flex-direction:column;gap:4px;margin-top:14px;font-size:13px}
.lock .links button{border:0;background:none;color:var(--brand2);text-align:left;padding:3px 0;font-weight:600}
.lock .links button:hover{text-decoration:underline}
.lock .btn.primary{width:100%;justify-content:center;padding:10px}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .grid2{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .c-plazo,.c-resp,.th-plazo,.th-resp{display:none}
}
@media (max-width:640px){
  .top{padding:10px 12px}main{padding:12px}.tools{padding:10px 12px 0}.procbar{padding:10px 12px}
  .two{grid-template-columns:1fr}
  .tools input[type=search]{width:100%}
  .gin{--lw:190px}
}

/* ---------- mesas, jornada y contactos ---------- */
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.kpis>div{flex:1;min-width:130px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fbfcfe}
.kpis b{display:block;font-size:19px;color:var(--ink)}
.kpis span{font-size:12px;color:var(--mute)}
.kpis .warn{background:#fff6e0;border-color:#f0d58c}.kpis .ok{background:#e6f5ec;border-color:#a9dcbc}
.tag.okt{background:#e2f3e8;color:#1d6b3c}.tag.warnt{background:#fff1cc;color:#7a5600}
.mtbl tr.mrow.open td{background:#f4f7fc}
.mtbl tr.mmem td{background:#f4f7fc;padding:4px 10px 12px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.mcell{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;display:flex;flex-direction:column;gap:4px}
.mcell .mrl{font-size:11.5px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.3px}
.mcell.m-ok{border-color:#a9dcbc;background:#f2fbf5}.mcell.m-av{border-color:#f0d58c;background:#fffaeb}.mcell.m-inc{border-color:#efc4c6;background:#fdf1f1}.mcell.m-gr{opacity:.7}
.jtbl tr.j-ok td{background:#f0faf3}.jtbl tr.j-inc td{background:#fdf1f1}
.jtbl tfoot td{border-top:2px solid var(--line);padding:8px 6px}
.segchips .lg.yo{--c:#14305f}

/* ---------- documentos de impresión A4 ---------- */
#printdoc{display:none}
@media print{
  body.printdoc>*:not(#printdoc){display:none!important}
  body.printdoc #printdoc{display:block;font:9.5pt/1.35 Arial,Helvetica,sans-serif;color:#000;background:#fff}
  body.printdoc{background:#fff!important;font-size:9.5pt}
}
#printdoc .pr-head{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #14305f;padding-bottom:4px;margin-bottom:8px}
#printdoc .pr-org{font-weight:700;color:#14305f;font-size:10pt}
#printdoc .pr-proc{font-size:8pt;color:#333;text-align:right}
#printdoc .pr-h1{font-size:15pt;margin:4px 0 2px;color:#14305f}
#printdoc .pr-sub{font-size:8.5pt;color:#444;margin-bottom:8px}
#printdoc .pr-h2{font-size:11pt;margin:12px 0 4px;color:#14305f;border-bottom:1px solid #b9c4d6;padding-bottom:2px;break-after:avoid;page-break-after:avoid}
#printdoc .pr-h2 small{font-weight:400;color:#444}
#printdoc .pr-h3{font-size:9.5pt;margin:8px 0 3px;break-after:avoid;page-break-after:avoid}
#printdoc .pr-break{break-before:page;page-break-before:always}
#printdoc .pr-p{margin:3px 0 6px}
#printdoc .pr-empty{color:#555;font-style:italic;margin:3px 0 6px}
#printdoc .pr-ul{margin:3px 0 6px;padding-left:18px}
#printdoc table.pr-t{width:100%;border-collapse:collapse;margin:2px 0 8px;font-size:8.5pt}
#printdoc table.pr-t th{background:#e9eef6;border:1px solid #9aa7bb;padding:3px 4px;text-align:left;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printdoc table.pr-t td{border:1px solid #b9c4d6;padding:3px 4px;vertical-align:top}
#printdoc table.pr-t thead{display:table-header-group}
#printdoc table.pr-t tr{break-inside:avoid;page-break-inside:avoid}
#printdoc table.pr-t td small{color:#444}
#printdoc table.pr-t tr.late td{background:#fde2e3;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printdoc table.pr-t tr.hito td{background:#fff3c4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printdoc table.pr-t tr.closed td{color:#555}
#printdoc table.pr-t.compact td{padding:2px 4px}
#printdoc table.pr-t.tall td{height:9mm}
#printdoc .pr-blank{display:inline-block;width:100%;border-bottom:1px dotted #888;height:10px}
#printdoc table.pr-kv{border-collapse:collapse;width:100%;margin:4px 0 8px;font-size:9pt}
#printdoc table.pr-kv th{width:26%;text-align:left;background:#f1f4f9;border:1px solid #b9c4d6;padding:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printdoc table.pr-kv td{border:1px solid #b9c4d6;padding:4px}
#printdoc .pr-note{border:1px solid #c9d3e3;border-radius:4px;padding:4px 6px;margin:4px 0;break-inside:avoid;page-break-inside:avoid}
#printdoc .pr-nh{font-size:8pt;color:#333;margin-bottom:2px}
#printdoc .pr-lines{height:40mm;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 7.6mm,#999 7.6mm,#999 8mm);background-size:100% 8mm;-webkit-print-color-adjust:exact;print-color-adjust:exact;border:1px solid #b9c4d6}
#printdoc .pr-lines.tall{height:70mm}
#printdoc .pr-kpis{display:flex;gap:6px;margin:6px 0 8px}
#printdoc .pr-kpis div{flex:1;border:1px solid #b9c4d6;border-radius:4px;padding:4px 6px}
#printdoc .pr-kpis b{display:block;font-size:12pt}
#printdoc .pr-kpis span{font-size:8pt;color:#333}
#printdoc .pr-block{break-inside:avoid-page}
#printdoc table.pr-cal{width:100%;border-collapse:collapse;table-layout:fixed;font-size:7pt}
#printdoc table.pr-cal th{background:#e9eef6;border:1px solid #9aa7bb;padding:2px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printdoc table.pr-cal td{border:1px solid #9aa7bb;vertical-align:top;height:23mm;padding:2px 3px;overflow:hidden}
#printdoc.land .pr-foot{margin-top:4px}
#printdoc table.pr-cal td.out{background:#f3f3f3;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printdoc table.pr-cal td.vote{background:#e3edfb;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printdoc .pr-dn{font-size:8pt;margin-bottom:1px}
#printdoc .pr-ce{line-height:1.2;margin:1px 0;overflow:hidden;max-height:2.5em}
#printdoc .pr-ce.hito{background:#fff3c4;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printdoc .pr-ce.more{color:#444;font-style:italic}
#printdoc .pr-legend{font-size:7.5pt;color:#333;margin-top:4px}
#printdoc table.pr-grid{font-size:7pt;table-layout:fixed}
#printdoc table.pr-grid th:first-child,#printdoc table.pr-grid td:first-child{width:24%}
#printdoc table.pr-grid td.nd{background:#e1e1e1;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printdoc table.pr-grid td.rs{background:#ffe8a8;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printdoc .pr-foot{margin-top:10px;border-top:1px solid #b9c4d6;padding-top:3px;font-size:7.5pt;color:#444}
/* menú de impresión */
.dr-act{display:flex;gap:6px;align-items:flex-start}
.prbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.prlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin:10px 0}
.prop{text-align:left;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fbfcfe;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:3px}
.prop:hover{border-color:var(--brand);background:#eef4fb}
.prop span{font-size:12px;color:var(--mute)}
.btn.prt{white-space:nowrap}

/* ---------- documentos adjuntos ---------- */
.att{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;margin-bottom:6px;background:#fdfdfe}
.ati{flex:none;font-size:10px;font-weight:700;border-radius:4px;padding:3px 5px;color:#fff;background:#6b7280}
.ati.pdf{background:#c0392b}.ati.xls{background:#1d6f42}.ati.img{background:#2e7d5b}
.atm{flex:1;min-width:0;display:flex;flex-direction:column}
.atn{border:0;background:none;padding:0;text-align:left;color:var(--brand);font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.atn:hover{text-decoration:underline}
.atm small{color:var(--mute)}
.atb{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.atl{margin:6px 0}
.drop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:2px dashed var(--line);border-radius:8px;padding:10px}
.drop.on{border-color:var(--brand);background:#eef4fb}
.viewer{position:fixed;inset:0;z-index:90;background:#2b3038;display:flex;flex-direction:column}
.vw-h{display:flex;gap:8px;align-items:center;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vw-t{flex:1;min-width:180px;display:flex;flex-direction:column;overflow:hidden}
.vw-t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vw-t small{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vw-n{font-size:12px;color:var(--mute);white-space:nowrap}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.vw-b{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:16px;min-height:0}
.vw-b img{max-width:100%;height:auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.vw-b .vw-pdf{width:100%;height:100%;border:0;background:#fff;min-height:70vh}
.vw-b:has(.vw-pdf){padding:0}
/* visor de hojas de cálculo */
.xlwrap{width:100%;display:flex;flex-direction:column;gap:8px;align-self:stretch}
.xltabs{display:flex;gap:4px;flex-wrap:wrap}
.xltabs button{border:1px solid #c9d3e3;background:#e9eef6;border-radius:6px 6px 0 0;padding:5px 12px;font-size:12.5px;cursor:pointer}
.xltabs button.on{background:#fff;font-weight:700;border-bottom-color:#fff}
.xlsheet{background:#fff;overflow:auto;border-radius:4px;max-height:calc(100vh - 150px)}
.xlname{display:none;font-weight:700;padding:6px 0}
table.xls{border-collapse:collapse;font-size:12px;font-family:Calibri,Arial,sans-serif}
table.xls th{background:#f0f2f5;color:#666;font-weight:400;border:1px solid #d5d9e0;padding:2px 6px;position:sticky;top:0;z-index:1}
table.xls tbody th{position:sticky;left:0;top:auto;text-align:right;z-index:0}
table.xls td{border:1px solid #e1e4e9;padding:2px 6px;white-space:pre-wrap;vertical-align:top;max-width:420px}
table.xls td.n{text-align:right}
.vw-note{color:#e8ebf0;font-size:12.5px}
@media print{body.printing .xltabs{display:none}body.printing .xlsheet{max-height:none;overflow:visible}body.printing .xlname{display:block}body.printing table.xls{font-size:9px}body.printing .vw-note{color:#555}}
.vw-msg{color:#e8ebf0;margin-top:18vh;text-align:center;font-size:15px;line-height:1.8}
.vw-msg.err{color:#ffd2d2}
body.vw-open{overflow:hidden}
.lnk{border:0;background:none;padding:0;color:var(--brand);cursor:pointer;text-align:left;font:inherit}
.lnk:hover{text-decoration:underline}
@media print{
  body.printing>*:not(#viewer){display:none!important}
  body.printing .viewer{position:static;background:#fff;display:block}
  body.printing .vw-h{display:none}
  body.printing .vw-b{padding:0;overflow:visible;display:block}
  body.printing .vw-b img{box-shadow:none;max-width:100%;max-height:100vh}
}

/* ---------- impresión ---------- */
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:11px}
  .top,.tabs,.banner,.tools,.drawer,.scrim,.toast,.modal,.lock,.btn,.count{display:none!important}
  .procbar{border:0;padding:0 0 8px}
  .procbar .prog{display:none}
  main{padding:0;max-width:none}
  .tblwrap,.card,.cal,.gscroll{box-shadow:none;border:1px solid #bbb;overflow:visible;max-height:none}
  .tbl th,.tbl tr.sec td{position:static}
  .tbl tr{break-inside:avoid}
  .c-plazo,.c-resp{display:table-cell!important}
  .c-chk input{display:none}
}

/* ---------- manual ---------- */
.help h3{font-size:15.5px;margin:22px 0 6px;color:var(--brand)}
.help p,.help li{color:var(--ink2);line-height:1.6}
.help ol{padding-left:22px;margin:6px 0}
.help li{margin:5px 0}
.help .legend .lg{cursor:default}
@media print{.help{border:0!important}.help h3{break-after:avoid}}

/* ---------- seguimiento ---------- */
.phase{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px 8px;margin-bottom:14px}
.ph-t{font-size:14.5px;margin-bottom:10px;color:var(--ink2)}
.ph-t b{color:var(--brand)}
.phbar{position:relative;display:flex;height:30px;margin:6px 0 26px;border-radius:6px}
.phbar>div{min-width:0;background:#e6ebf4;border-right:2px solid #fff;font-size:10.5px;font-weight:700;color:var(--ink2);display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px}
.phbar>div:first-child{border-radius:6px 0 0 6px}.phbar>div:last-child{border-radius:0 6px 6px 0;border-right:0}
.phbar>div.done{background:#c9d5ea;color:#3f4f6e}
.phbar>div.cur{background:var(--brand);color:#fff}
.phbar .mk{position:absolute;top:-7px;bottom:-7px;width:3px;margin-left:-1px;background:var(--today);border-radius:2px;box-shadow:0 0 0 2px #fff}
.phbar .mk span{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;font-size:11px;font-weight:800;color:var(--today);white-space:nowrap;font-style:normal}
.segchips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 6px}
.segchips .lbl{margin-right:2px}
.segact{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.sg h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2);margin:20px 0 8px;display:flex;gap:8px;align-items:center}
.sg h3 .n{background:var(--line2);color:var(--ink2);border-radius:99px;padding:0 8px;font-size:12px;letter-spacing:0}
.sg h3.red{color:var(--bad)}.sg h3.red .n{background:var(--bad-bg);color:var(--bad)}
.sg h3.blue{color:var(--brand2)}.sg h3.blue .n{background:var(--info-bg);color:var(--brand2)}
.sg h3.muted{color:var(--mute)}
.sc{background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.sc.open{box-shadow:var(--shadow);border-color:#c6d2e6}
.sc.late{border-color:#efb4b7;background:#fffafa}
.sc.closed .sc-t{color:var(--mute);text-decoration:line-through}
.sc-h{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;cursor:pointer;border-radius:9px}
.sc-h:hover{background:#f7f9fd}
.abbr{flex:none;width:96px;text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.5px;border-radius:6px;padding:6px 4px;margin-top:1px}
.ab-p{background:#eceff5;color:#46536a}.ab-c{background:#dbe7fd;color:#174aa8}.ab-h{background:#d8f1e2;color:#0f6b3a}.ab-n{background:#efe8f8;color:#5f4192}.ab-v{background:var(--bad);color:#fff}
.sc-m{flex:1;min-width:0}
.sc-d{font-size:12.5px;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}

<script>
(function () {
'use strict';
/* ============================================================
   ESPAIS ELECTORALS · núcleo: utilidades, estado y sincronización con el servidor
   ============================================================ */
const DAY = 86400000;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const p2 = (n) => (n < 10 ? '0' : '') + n;
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ROLES = { admin: 'Administración (Ayuntamiento)', partido: 'Partido', consulta: 'Consulta' };
const CATS = ['esp', 'ban', 'pan', 'pri'];
const CATN = { esp: 'Espacios electorales', ban: 'Banderolas', pan: 'Pancartas', pri: 'Prismas' };
const CAT1 = { esp: 'espacio', ban: 'tramo de banderolas', pan: 'pancarta', pri: 'prisma' };
const MODEN = { cerrado: 'Cerrada', turnos: 'Por turnos', libre: 'Libre' };
const COLS = {
  esp: [['ord', 'Nº', 'number', 46], ['nom', 'Nombre', 'text', 200], ['ot', 'Abierto / cerrado', 'text', 100], ['dir', 'Dirección', 'text', 200], ['hor', 'Horario de uso', 'text', 240], ['nota', 'Notas', 'text', 150]],
  ban: [['ord', 'Nº', 'number', 46], ['nom', 'Calle', 'text', 180], ['tram', 'Tramo', 'text', 210], ['bf', 'Banderolas', 'number', 70], ['pf', 'Plafones', 'number', 70], ['nota', 'Notas', 'text', 150]],
  pan: [['ord', 'Nº', 'number', 46], ['lloc', 'Lugar', 'text', 210], ['lim', 'Límites', 'text', 280], ['nota', 'Notas', 'text', 150]],
  pri: [['ord', 'Nº', 'number', 46], ['lloc', 'Lugar', 'text', 210], ['num', 'Número / ubicación', 'text', 180], ['nota', 'Notas', 'text', 150]]
};
const PALETTE = ['#D32F2F', '#1E88E5', '#2E7D32', '#F9A825', '#6A1B9A', '#00838F', '#EF6C00', '#AD1457', '#5D4037', '#3949AB', '#7CB342', '#546E7A', '#C2185B', '#00897B', '#8E24AA', '#FB8C00'];

/* ---------- fechas (UTC) ---------- */
const parseISO = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; };
const toISO = (t) => { const d = new Date(t); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()); };
const fmt = (opts) => { const f = new Intl.DateTimeFormat('es-ES', Object.assign({ timeZone: 'UTC' }, opts)); return (t) => f.format(t).replace(/\./g, ''); };
const fShort = fmt({ weekday: 'short', day: 'numeric', month: 'short' });
const fLong = fmt({ weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const cap = (s) => String(s).charAt(0).toUpperCase() + String(s).slice(1);
const fDMY = (t) => { const d = new Date(t); return p2(d.getUTCDate()) + '/' + p2(d.getUTCMonth() + 1) + '/' + d.getUTCFullYear(); };
const fStamp = (ms) => { if (!Number.isFinite(+ms)) return ''; const d = new Date(+ms); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); };
const hhmm = (ms) => { const d = new Date(ms); return p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()); };
const slotTxt = (s) => (s ? cap(fShort(parseISO(s.slice(0, 10)))) + ' · ' + (s[10] === 'M' ? 'mañana' : 'tarde') : '');

/* ---------- almacenamiento del navegador (solo comodidad y cambios aún no enviados) ---------- */
const LS = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }, del(k) { try { localStorage.removeItem(k); } catch (e) { /* nada */ } } };
const SS = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* nada */ } }, del(k) { try { sessionStorage.removeItem(k); } catch (e) { /* nada */ } } };

/* ---------- estado ---------- */
const ST = {
  db: null, seq: 0, urev: 0, users: [], me: null, user: '', tok: null, pend: {},
  sync: 'idle', lastSaved: 0, saving: false, again: false, online: true, failN: 0, pollN: 0, rev: 0,
  view: 'panel', ui: { flt: {}, q: {}, edit: {}, lflt: '', lq: '' }, timers: [], modalRes: null, modalLocked: false, hist: null, drafts: {}, busy: false, lastAct: Date.now()
};
const myRole = () => (ST.me && ST.me.role) || 'consulta';
const isAdmin = () => myRole() === 'admin';
const isParty = () => myRole() === 'partido';
const myParty = () => (isParty() && ST.me ? ST.me.party : '');

/* ---------- llamadas al servidor ---------- */
async function api(path, body) {
  const headers = { 'content-type': 'application/json' };
  if (ST.tok) headers.authorization = 'Bearer ' + ST.tok;
  let r;
  try { r = await fetch('/api/' + path, { method: body ? 'POST' : 'GET', headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store', credentials: 'same-origin' }); }
  catch (e) { const er = new Error('Sin conexión con el servidor.'); er.net = true; throw er; }
  let data = null; try { data = await r.json(); } catch (e) { /* sin cuerpo */ }
  if (!r.ok) { const er = new Error((data && data.error) || ('Error ' + r.status + ' del servidor.')); er.status = r.status; throw er; }
  return data;
}

/* ---------- cambios del Ayuntamiento: se ven al momento y se envían en segundo plano ---------- */
const pendKey = () => 'espais.pend.' + (ST.me ? ST.me.id : '');
function savePend() { const ks = Object.keys(ST.pend); if (ks.length) LS.set(pendKey(), JSON.stringify(ST.pend)); else LS.del(pendKey()); }
function loadPend() { try { return JSON.parse(LS.get(pendKey())) || {}; } catch (e) { return {}; } }
const pendCount = () => Object.keys(ST.pend).length;
function put(key, obj) { obj.u = Date.now(); obj.b = ST.user; ST.db.E[key] = obj; ST.pend[key] = obj; markDirty(); return obj; }
function putQuiet(key, obj) { obj.u = Date.now(); obj.b = ST.user; ST.db.E[key] = obj; ST.pend[key] = obj; }
function markDirty() { savePend(); ST.rev++; ST.sync = 'pending'; paintSync(); clearTimeout(ST.saveT); ST.saveT = setTimeout(flush, 350); if (ST.db) renderAll(); }
function applyServer(r) {
  let ch = false;
  if (r.E) for (const k in r.E) { if (ST.pend[k]) continue; ST.db.E[k] = r.E[k]; ch = true; }
  if (r.rejected) r.rejected.forEach((x) => { if ((!r.E || !r.E[x.key]) && !ST.pend[x.key]) { delete ST.db.E[x.key]; ch = true; } });
  if (typeof r.seq === 'number' && r.seq > ST.seq) ST.seq = r.seq;
  if (r.users) { ST.users = r.users; ch = true; }
  if (r.urev) ST.urev = r.urev;
  if (r.me && ST.me && (r.me.role !== ST.me.role || r.me.name !== ST.me.name || r.me.party !== ST.me.party)) { ST.me = Object.assign(ST.me, r.me); ST.user = ST.me.name; SS.set('espais.me', JSON.stringify(ST.me)); ch = true; }
  if (ch) { ST.rev++; renderAll(); }
}
async function flush() {
  clearTimeout(ST.saveT);
  if (!ST.db || !ST.tok) return;
  if (ST.saving) { ST.again = true; return; }
  const keys = Object.keys(ST.pend).slice(0, 400);
  if (!keys.length) { ST.sync = 'saved'; paintSync(); return; }
  ST.saving = true; ST.sync = 'saving'; paintSync();
  try {
    const batch = {}; keys.forEach((k) => { batch[k] = ST.pend[k]; });
    const r = await api('sync', { changes: batch, since: ST.seq });
    keys.forEach((k) => { if (ST.pend[k] === batch[k]) delete ST.pend[k]; });
    savePend(); applyServer(r);
    if (r.rejected && r.rejected.length) toast('No se ha guardado: ' + r.rejected[0].reason + (r.rejected.length > 1 ? ' (y ' + (r.rejected.length - 1) + ' cambios más)' : ''), 'err');
    const wasOff = !ST.online; ST.online = true; ST.failN = 0; ST.lastSaved = Date.now(); if (wasOff) paintBanner();
  } catch (e) { handleNetErr(e); }

/* ---------- estado de una categoría (turno, cupos, recuento) ---------- */
function statusHTML(t, full) {
  const c = cfgOf(t), I = idx(), tot = slotsOf(t), taken = takenOf(t), cp = curParty(c), g = myParty();
  let h = '<div class="card stat"><div class="fhead"><h3>' + (full ? '' : '<button class="lnk" data-a="tab" data-v="' + t + '">') + CATN[t] + (full ? '' : '</button>') + ' <span class="mode m-' + c.mode + '">' + MODEN[c.mode] + '</span></h3>' +
    (isAdmin() ? '<button class="btn sm" data-a="tab" data-v="turnos">Reglas y turnos</button>' : '') + '</div>' +
    '<div class="kpis"><div><b>' + taken + ' / ' + tot + '</b><span>' + (t === 'esp' ? 'franjas reservadas' : 'reservados') + '</span></div><div><b>' + Math.max(tot - taken, 0) + '</b><span>libres</span></div>' +
    (isParty() ? '<div><b>' + myCount(t, g) + (limOf(c, g) < Infinity ? ' / ' + limOf(c, g) : '') + '</b><span>' + (c.cup && c.cup[g] != null ? 'vuestras reservas / cupo' : 'vuestras reservas') + '</span></div>' : '<div><b>' + (hasCup(c) ? 'Según el reparto' : c.max > 0 ? c.max : 'Sin límite') + '</b><span>' + (hasCup(c) ? 'cupo de cada partido' : 'máximo por partido') + '</span></div>') + '</div>';
  if (c.mode === 'turnos') {
    const ord = effOrder(c), tots = {}; ord.forEach((x) => { tots[x] = myCount(t, x); });
    h += c.done ? '<div class="turnbox done"><b>Selección por turnos terminada.</b></div>'
      : '<div class="turnbox' + (cp && cp === g ? ' mine' : '') + '"><span>Ronda ' + (c.round || 1) + ' · Turno de</span> ' + pChip(cp) + '<span>' + (c.used || 0) + ' de ' + c.quota + (c.quota === 1 ? ' elección' : ' elecciones') + ' hechas en este turno</span>' +
        (cp && (isAdmin() || cp === g) ? '<button class="btn sm" data-a="pass" data-t="' + t + '">' + (isAdmin() ? 'Pasar al siguiente' : 'Terminar mi turno') + '</button>' : '') + '</div>';
    h += '<div class="order">' + ord.map((x, i) => { const L = limOf(c, x); return '<span class="oi' + (i === (c.turn || 0) && !c.done ? ' cur' : '') + (tots[x] >= L ? ' full' : '') + '"><small>' + (i + 1) + '</small>' + pChip(x, true) + '<small>' + tots[x] + (L < Infinity ? '/' + L : '') + '</small></span>'; }).join('<span class="oarr">›</span>') + '</div>' +
      '<p class="muted small">Orden de elección' + (c.snake ? ' (se invierte en cada ronda)' : '') + ' · ' + c.quota + (c.quota === 1 ? ' elección' : ' elecciones') + ' por turno' + (hasCup(c) ? ' · cupos según el reparto' : c.max > 0 ? ' · máximo ' + c.max + ' por partido' : '') + '. A la derecha de cada partido, lo que lleva' + (hasCup(c) || c.max > 0 ? ' y su límite; quien lo completa ya no tiene turno' : '') + '.</p>';
  } else if (c.mode === 'libre') h += '<div class="turnbox"><b>Selección libre:</b>&nbsp;cada partido elige cuando quiere' + (c.max > 0 ? ', hasta ' + c.max : '') + '.</div>';
  else h += '<div class="turnbox closed"><b>Selección cerrada.</b>&nbsp;' + (isAdmin() ? 'Solo el Ayuntamiento puede asignar. Ábrela en «Turnos y reglas».' : 'El Ayuntamiento la abrirá cuando corresponda.') + '</div>';
  if (c.msg) h += '<div class="hint"><b>Aviso del Ayuntamiento:</b> ' + esc(c.msg).replace(/\n/g, '<br>') + '</div>';
  if (isAdmin() && c.mode === 'turnos') h += '<div class="btnrow"><button class="btn sm" data-a="turn" data-t="' + t + '" data-op="prev">◀ Retroceder turno</button><button class="btn sm" data-a="turn" data-t="' + t + '" data-op="next">Avanzar turno ▶</button></div>';
  return h + '</div>';
}

/* ---------- categoría: lista o cuadrante ---------- */

  const id = 'r' + kind + '-' + r.id + '-' + f, v = ST.drafts[id] != null ? ST.drafts[id] : (fv(r, f) == null ? '' : fv(r, f));
  return '<input type="' + (type || 'text') + '" id="' + id + '" data-r="' + kind + '" data-f="' + f + '" data-id="' + r.id + '" data-draft value="' + esc(v) + '"' + (ro ? ' disabled' : '') + ' style="min-width:' + w + 'px;width:100%" aria-label="' + esc(label) + '"' + (type === 'number' ? ' min="0" max="9999"' : '') + (extra || '') + '>';
}
function partyOpts(sel, withEmpty) { return (withEmpty ? '<option value="">' + esc(withEmpty) + '</option>' : '') + idx().parties.map((p) => '<option value="' + p.id + '"' + (p.id === sel ? ' selected' : '') + '>' + esc((p.sig || p.nom) + (p.sig && p.nom ? ' · ' + p.nom : '')) + '</option>').join(''); }
function viewCat(t) {

    (isAdmin() ? '<button class="btn sm' + (edit ? ' primary' : '') + '" data-a="edit" data-t="' + t + '">' + (edit ? '✓ Terminar edición' : '✎ Editar lista') + '</button>' + (edit ? '<button class="btn sm" data-a="i-add" data-t="' + t + '">+ Añadir ' + CAT1[t] + '</button><button class="btn sm" data-a="xf-open" data-t="' + t + '">Campos propios…</button>' : '') + '<button class="btn sm" data-a="imp-xls">Importar Excel…</button>' : '') +

  h += '<div class="filters"><select id="flt-' + t + '" data-flt="' + t + '" aria-label="Mostrar"><option value="all">Todos</option><option value="free"' + (f === 'free' ? ' selected' : '') + '>Solo libres</option><option value="taken"' + (f === 'taken' ? ' selected' : '') + '>Solo reservados</option>' + (t !== 'esp' ? '<option value="nd"' + (f === 'nd' ? ' selected' : '') + '>No disponibles</option>' : '') + (isParty() ? '<option value="mine"' + (f === 'mine' ? ' selected' : '') + '>Solo los nuestros</option>' : '') + '<optgroup label="Por partido">' + I.parties.map((p) => '<option value="p:' + p.id + '"' + (f === 'p:' + p.id ? ' selected' : '') + '>' + esc(p.sig || p.nom) + '</option>').join('') + '</optgroup></select>' +
    '<input type="search" id="q-' + t + '" data-q="' + t + '" value="' + esc(q) + '" placeholder="🔍 Buscar ' + ({ esp: 'un espacio', ban: 'una calle o un tramo', pan: 'un lugar o unos límites', pri: 'un lugar o un número' }[t]) + '…" style="max-width:340px"></div>';
  return h + (t === 'esp' ? gridHTML(edit) : listHTML(t, edit)) + '</div>';
}
function passFilter(t, it, r) {
  const f = ST.ui.flt[t] || 'all', q = norm(ST.ui.q[t] || '');
  if (q && norm(colsOf(t).map((c) => fv(it, c[0])).join(' ') + ' ' + (r ? pName(r.g) : '')).indexOf(q) < 0) return false;
  if (t === 'esp') return true;
  if (f === 'nd') return !!it.nd;
  if (f === 'free') return !r && !it.nd; if (f === 'taken') return !!r; if (f === 'mine') return !!r && r.g === myParty();
  if (f.indexOf('p:') === 0) return !!r && r.g === f.slice(2);
  return true;
}
function listHTML(t, edit) {
  const I = idx(), pick = canPick(t), rows = I.items[t].map((it) => ({ it, r: activeRes(it.id) })).filter((x) => passFilter(t, x.it, x.r));
  if (!rows.length) return '<p class="muted">Nada coincide con el filtro.</p>';
  const adm = isAdmin() && !edit;
  return '<div class="tblwrap"><table class="tbl ftbl ltbl"><thead><tr>' + colsOf(t).map((c) => '<th>' + c[1] + '</th>').join('') + '<th>Estado</th>' + (adm ? '<th>¿Elegible?</th>' : '') + '<th></th>' + (adm ? '<th></th>' : '') + '</tr></thead><tbody>' +
    rows.map(({ it, r }) => '<tr class="' + (it.nd ? 'ndr' : r ? (r.g === myParty() ? 'mine' : 'taken') : 'free') + '">' + colsOf(t).map((c) => '<td' + (c[2] === 'number' ? ' class="num"' : '') + '>' + (edit ? rin('i', it, c[0], c[2], c[2] === 'number' ? 48 : Math.min(c[3], 160), c[1]) : esc(fv(it, c[0]) == null ? '' : fv(it, c[0]))) + '</td>').join('') +
      '<td' + (it.nd ? '' : ' class="nowrap"') + '>' + (it.nd ? '<span class="nd-l">No disponible</span>' + (it.ndm ? '<small class="ndm">' + esc(it.ndm) + '</small>' : '') : r ? pChip(r.g) : '<span class="free-l">Libre</span>') + '</td>' + (adm ? '<td>' + ndSelect(it, r) + '</td>' : '') + '<td class="nowrap">' + rowAction(t, it, r, pick, edit) + '</td>' + (adm ? '<td><button class="btn sm ghost" data-a="i-del" data-id="' + it.id + '" title="Borrar esta línea">🗑</button></td>' : '') + '</tr>').join('') + '</tbody></table></div>';

/* desplegable «Elegible / No elegible» de cada elemento (administración) */

    days.forEach((d) => ['M', 'T'].forEach((m) => {

function modalCell(i, s) {

const METHN = { '': 'Sin cupos', prop: 'Proporcional a los votos (restos mayores)', dhondt: 'Proporcional a los votos (D’Hondt)', igual: 'A partes iguales' };
const DEF_METH = { esp: '', ban: 'prop', pan: 'prop', pri: 'prop' };
const rmeth = (t) => { const m = conf().rmeth; return m && m[t] != null ? m[t] : DEF_METH[t]; };
const fmtN = (n) => (n == null ? '' : String(Math.round(+n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'));
const pct = (v, V) => (V ? (v * 100 / V).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '—');
const cupOf = (t, g) => { const k = cfgOf(t).cup || {}; return k[g] != null ? k[g] : null; };
const totVot = () => idx().parties.reduce((s, p) => s + (p.vot || 0), 0);
/* reparte n elementos entre los partidos (en su orden de preferencia): primero el mínimo a cada uno y el resto según el método.
   Los empates se resuelven a favor de quien tiene más votos y, después, de quien va antes en el orden. */
function repartir(n, ps, meth, minp) {
  const out = {}; ps.forEach((p) => { out[p.id] = 0; });
  if (!ps.length || n <= 0 || !meth) return out;
  let left = n; const m = Math.min(minp || 0, Math.floor(n / ps.length));
  if (m > 0) { ps.forEach((p) => { out[p.id] = m; }); left -= m * ps.length; }
  const vot = ps.filter((p) => p.v > 0), V = vot.reduce((s, p) => s + p.v, 0);
  if (meth === 'igual' || !V) { const q = Math.floor(left / ps.length); let r = left - q * ps.length; ps.forEach((p) => { out[p.id] += q + (r-- > 0 ? 1 : 0); }); return out; }
  if (meth === 'dhondt') {
    const s = {}; vot.forEach((p) => { s[p.id] = 0; });
    for (let k = 0; k < left; k++) { let best = null, bq = -1; vot.forEach((p) => { const q = p.v / (s[p.id] + 1); if (q > bq) { bq = q; best = p; } }); s[best.id]++; }
    vot.forEach((p) => { out[p.id] += s[p.id]; }); return out;
  }
  const ex = vot.map((p) => { const q = left * p.v / V; return { p, q, f: Math.floor(q) }; }), used = ex.reduce((s, x) => s + x.f, 0);
  ex.slice().sort((a, b) => (b.q - b.f) - (a.q - a.f) || b.p.v - a.p.v).slice(0, left - used).forEach((x) => { x.f++; });
  ex.forEach((x) => { out[x.p.id] += x.f; });
  return out;
}
function repPlan() { const ps = idx().parties.map((p) => ({ id: p.id, v: p.vot || 0 })), minp = +conf().rmin || 0, out = {}; CATS.forEach((t) => { out[t] = rmeth(t) ? repartir(slotsOf(t), ps, rmeth(t), minp) : null; }); return out; }

      '<li>Para <b>seguir la sesión</b>, abrid la pestaña <b>● En directo</b>: de quién es el turno en cada categoría, qué se acaba de elegir y lo que lleva cada candidatura. El Ayuntamiento puede proyectarla en la sala.</li>' +

      '<li>Pulsad <b>«Ir a elegir»</b>: llegáis a la lista o al cuadrante de esa categoría. Si no encontráis algo, usad <b>«🔍 Buscar»</b>.</li>' +
      '<li>Pulsad <b>«Reservar»</b> y confirmad. Queda reservado y en unos segundos aparece ocupado para todas las candidaturas, que ya no lo pueden elegir.</li>' +
      '<li>Al completar las elecciones de vuestro turno (normalmente una), <b>el turno pasa solo</b> a la siguiente candidatura. Si no queréis elegir más en esa ronda, pulsad <b>«Terminar mi turno»</b>.</li>' +
      '<li>Ronda tras ronda, hasta completar vuestro cupo. Al final, <b>«🖨 Imprimir lo elegido por…»</b> genera vuestra hoja con todo lo asignado.</li></ol></div>', 'h-dia') +
    hsec(2, 'Entrar', '<p>Abrid <b>' + esc(appUrl()) + '</b> con Edge o Chrome (también funciona en el móvil) y entrad con el usuario y la contraseña provisional que os ha dado el Ayuntamiento. La primera vez el programa os pedirá que elijáis vuestra propia contraseña. Cada candidatura tiene su usuario: no lo compartáis, porque todo lo que se hace queda registrado con el nombre de quien lo hace. Si olvidáis la contraseña, el Ayuntamiento os da una nueva.</p>') +
    hsec(3, 'Cómo se reparte según la ley', legalHTML(), 'h-ley') +
    hsec(4, 'Turnos, rondas y cupos: cómo se elige', TURNOS_HTML(), 'h-turnos') +
    hsec(5, 'Cómo elegir y cómo liberar', '<p><b>Banderolas, pancartas y prismas:</b> cuando sea vuestro turno, pulsad <b>«Reservar»</b> en la fila que queráis. Con el filtro podéis ver solo lo libre y con el buscador encontrar una calle o un lugar. <b>Espacios electorales:</b> hay un cuadrante con una fila por espacio y la mañana (M) y la tarde (T) de cada día de campaña; pulsad una casilla libre y confirmad. Las casillas con ⚠ tienen restricciones de uso; las grises (N/D) no están disponibles. Lo que el Ayuntamiento ha marcado como <b>no disponible</b> aparece en gris con el motivo y no se puede elegir.</p>' +
      '<p><b>Buscar.</b> Si no encontráis un espacio, una calle o un lugar, el botón <b>«🔍 Buscar»</b> de la barra de pestañas busca a la vez en las cuatro categorías y dice si cada cosa está libre, de quién es o si no está disponible. Desde ahí se puede reservar directamente cuando es vuestro turno, o ir a ese elemento en su lista o en el cuadrante. Cada pestaña tiene también su propio buscador.</p>' +
      '<p>Antes de reservar, el programa pide confirmación. En cuanto confirmáis, queda reservado y aparece ocupado para las demás candidaturas. Mientras la selección esté abierta podéis <b>liberar</b> lo vuestro (botón «Liberar» en la fila, en la casilla o en «Vuestras reservas» del Panel); si lo hacéis durante vuestro turno, recuperáis esa elección. Con la selección cerrada, pedídselo al Ayuntamiento.</p>') +
    hsec(6, 'Dónde ver lo que ha elegido cada candidatura', '<p>La pestaña <b>● En directo</b> (la del punto rojo, que late mientras la selección está abierta) lo reúne todo en una sola pantalla: arriba, de quién es el turno en cada categoría y las últimas elecciones a medida que se hacen; debajo, todo lo que tiene cada candidatura en las cuatro categorías, con filtros por candidatura y por categoría. En el <b>Panel</b> se ve el estado de cada categoría, el orden con lo que lleva cada candidatura y su cupo (por ejemplo, «3/14») y vuestras reservas. En cada pestaña (Espacios, Banderolas, Pancartas y Prismas) lo elegido aparece con las siglas de quien lo tiene. Todo se actualiza solo cada pocos segundos, sin recargar la página.</p>') +
    hsec(7, 'Imprimir lo elegido', '<p>El botón <b>«🖨 Imprimir lo elegido por…»</b> (en el Panel y en «En directo») abre un desplegable con todas las candidaturas, con la vuestra ya marcada: elegid una y se genera la hoja A4 con todo lo que tiene asignado y espacio para la firma. También está «Nuestras asignaciones» en «Imprimir resultados», el 🖨 de cada candidatura en la pestaña Partidos y la relación completa de asignaciones de todas las candidaturas. En la ventana de impresión se puede elegir «Guardar como PDF».</p>') +
    hsec(8, 'Preguntas frecuentes', '<p><b>¿Qué pasa si no elegimos en nuestro turno?</b> El turno sigue siendo vuestro hasta que elijáis o pulséis «Terminar mi turno». El Ayuntamiento puede pasar el turno si se ha acordado un tiempo máximo.</p>' +
      '<p><b>¿Podemos cambiar algo ya elegido?</b> Sí, mientras la selección esté abierta: liberadlo y elegid otro cuando os toque.</p>' +
      '<p><b>¿Y si dos candidaturas quieren lo mismo?</b> Se lo queda quien lo elige primero; el servidor no permite que dos candidaturas tengan lo mismo.</p>' +
      '<p><b>¿Podemos elegir fuera de nuestro turno?</b> No. El botón «Reservar» solo aparece cuando es vuestro turno, o en todo momento si el Ayuntamiento abre la categoría en modo libre.</p>' +
      '<p><b>¿Quién decide el orden y los cupos?</b> Salen de los votos de las anteriores elecciones equivalentes (art. 56 LOREG). El reparto lo acuerda la Junta Electoral de Zona y el Ayuntamiento lo aplica. Lo podéis consultar en la pestaña Reparto.</p>' +
      '<p><b>¿Qué es el «modo ensayo»?</b> Antes de la sesión de verdad, el Ayuntamiento puede hacer un ensayo para que practiquéis. Mientras dura, aparece arriba un aviso naranja <b>MODO ENSAYO</b>: lo que elijáis es de prueba y se borra al terminar el ensayo.</p>' +
      '<p><b>¿Queda constancia de todo?</b> Sí. Cada reserva, liberación y cambio de turno queda en el Registro con la fecha, la hora y el usuario, y el Ayuntamiento guarda copias de seguridad de todo.</p>');
}
/* parte 2 · manual del programa para el Ayuntamiento */
function helpAdmin() {
  return '<p>Manual para la administración del programa. Las candidaturas tienen su propia ayuda («Para las candidaturas»), que conviene imprimir y entregar en la reunión previa.</p>' +
    hsec(1, 'Puesta en marcha', '<ol><li><b>Ajustes:</b> tipo de elecciones (por defecto, Generales al Congreso de los Diputados), nombre del Ayuntamiento y <b>día de la votación</b>; la campaña se calcula sola (empieza el día 38 posterior a la convocatoria, dura 15 días y acaba a las cero horas del día anterior a la votación, art. 51 LOREG).</li><li><b>Importar desde Excel</b> (Ajustes): un solo Excel con todas las hojas. Se puede descargar la plantilla.</li><li><b>Partidos:</b> revisa las candidaturas y crea un usuario para cada una con «+ Usuario».</li><li><b>Reparto:</b> votos de las anteriores elecciones equivalentes, «Ordenar por votos» y «Calcular y fijar los cupos».</li><li><b>Turnos y reglas:</b> abre cada categoría por turnos (1 elección por turno) cuando corresponda.</li><li>Para la reunión con las candidaturas, imprime la <b>ayuda para las candidaturas</b> y el <b>reparto</b> con la hoja de conformidad.</li></ol>') +
    hsec(2, 'Cómo se hace el reparto en el programa', '<ol><li>En <b>Reparto</b>, escribe las <b>elecciones de referencia</b> y los <b>votos</b> que obtuvo cada candidatura en ellas. Las candidaturas nuevas, sin resultados anteriores, se dejan en 0. Los votos también pueden venir en el Excel.</li><li>Pulsa <b>«Ordenar las candidaturas por votos»</b>: la que tuvo más votos elige primero. Ese orden se aplica en Partidos y en los turnos de todas las categorías.</li><li>Elige el <b>método</b> de cada categoría y, si la Junta lo acuerda, un <b>mínimo</b> para cada candidatura:<ul><li><b>Proporcional (restos mayores):</b> cada candidatura recibe la parte entera de lo que le corresponde por sus votos y lo que sobra va a los restos más altos. Es el más fiel al porcentaje de votos.</li><li><b>Proporcional (D’Hondt):</b> el sistema del reparto de escaños; favorece un poco a las candidaturas con más votos.</li><li><b>A partes iguales:</b> lo mismo para todas; recomendado para los locales de actos (igualdad de oportunidades, art. 57).</li><li><b>Sin cupos:</b> sin límite por candidatura (se aplica, si lo hay, el máximo general de «Turnos y reglas»).</li></ul></li><li>Pulsa <b>«Calcular y fijar los cupos»</b>. Cada número se puede retocar a mano si la Junta acuerda otra cosa. Lo que esté marcado como no disponible no cuenta.</li></ol>' +
      '<div class="hint"><b>Ejemplo.</b> 30 tramos de banderolas y 4 candidaturas con 12.000, 8.000, 4.000 y 1.000 votos, con un mínimo de 1. Primero cada una recibe 1 (quedan 26). Los 26 se reparten en proporción a los votos: 12,48 · 8,32 · 4,16 · 1,04. Las partes enteras suman 25 y el tramo que sobra va al resto más alto (0,48). Cupos: <b>14, 9, 5 y 2</b>. El desarrollo ronda a ronda está en la ayuda para las candidaturas.</div>') +
    hsec(3, 'Turnos y reglas', '<p>Cada categoría puede estar <b>cerrada</b> (solo asigna el Ayuntamiento), <b>por turnos</b> o <b>libre</b> (cada candidatura elige cuando quiere, hasta su cupo o el máximo). En modo por turnos se fija el <b>orden</b>, las <b>elecciones por turno</b> y, si no hay cupos del reparto, un <b>máximo por candidatura</b>. El turno pasa solo al completar las elecciones del turno, cuando la candidatura completa su cupo o cuando pulsa «Terminar mi turno»; las que ya lo tienen completo se saltan. El Ayuntamiento puede avanzar, retroceder, dar el turno a una candidatura o reiniciar, y escribir un aviso que verán todas. Existe la opción de invertir el orden en cada ronda, pero no se recomienda: el art. 56 LOREG habla de orden decreciente de votos.</p>') +
    hsec(4, 'Ensayo antes de la sesión', '<p>Con <b>«Empezar un ensayo»</b> (en el Panel o en Turnos y reglas) las candidaturas pueden practicar con sus usuarios y elegir por turnos como el día de verdad. Todos ven el aviso naranja <b>MODO ENSAYO</b>. Antes de empezar se guarda una copia de seguridad y los turnos empiezan desde la ronda 1. Al pulsar <b>«Terminar el ensayo y borrar lo elegido»</b> se borran todas las elecciones hechas durante el ensayo y los turnos vuelven a la ronda 1; las candidaturas, los usuarios, los espacios, los cupos y las reglas no se tocan. Los movimientos del ensayo quedan en el Registro marcados como «ensayo» (ocultos salvo que se marque «Mostrar») y no salen en el acta.</p>') +
    hsec(5, 'Durante la selección', '<p><b>Cómo llevar la sesión.</b> Cada candidatura entra desde su propio ordenador o móvil. Conviene proyectar en la sala la pestaña <b>● En directo</b> desde el ordenador de la administración, para que todos vean de quién es el turno y lo que se va eligiendo. Cuando todo esté preparado, abre la categoría <b>por turnos</b> en «Turnos y reglas»: el turno es de la primera candidatura y los avisos verdes y los saltos de turno van solos. Si una candidatura no responde, «Pasar al siguiente»; si alguien lo pide por teléfono, «Asignar a…». Al terminar, imprime el acta y guarda una copia permanente.</p><p>El botón <b>«🔍 Buscar»</b> de la barra de pestañas encuentra cualquier espacio, calle o lugar en las cuatro categorías a la vez, con su estado. La pestaña <b>● En directo</b> (con el punto rojo) muestra al momento de quién es el turno en cada categoría, las últimas elecciones y todo lo que tiene cada candidatura; se puede proyectar en una pantalla durante la sesión. El Ayuntamiento puede asignar cualquier elemento a una candidatura (por ejemplo, si lo pide por teléfono o lo acuerda la Junta) con el desplegable «Asignar a…» o pulsando la casilla del cuadrante, y liberar cualquier reserva. Estas asignaciones no están limitadas por los turnos ni por los cupos.</p>') +
    hsec(6, 'Inhabilitar y disponibilidad', '<p>Si una banderola, pancarta, prisma o un espacio entero no se puede usar (obras, un mercado, un acto institucional…), el desplegable <b>«Elegible / No elegible»</b> de su fila (en los espacios, en la ventana que se abre al pulsar su nombre en el cuadrante) lo marca como <b>no elegible con un motivo</b>. Queda en gris con el motivo a la vista de todos, nadie lo puede elegir y deja de contar en el reparto. Volviendo a «Elegible» vuelve a estar disponible. Un elemento reservado no se puede inhabilitar hasta liberarlo. El botón <b>🗑</b> de cada fila (o «🗑 Borrar este espacio») borra esa línea, con confirmación; lo reservado no se puede borrar hasta liberarlo.</p><p>En los espacios, además, cada franja se marca como disponible, con restricciones o no disponible pulsando la casilla, y en bloque (un rango de días, solo mañanas o tardes, ciertos días de la semana) pulsando el nombre del espacio. Las franjas ya reservadas no se tocan.</p>') +
    hsec(7, 'Partidos y usuarios', '<p>En <b>Partidos</b> se dan de alta las candidaturas con su orden, color, representante y contacto (los datos de contacto solo los ve el Ayuntamiento). Se pueden pegar desde Excel. El botón «+ Usuario» crea el usuario de la candidatura con una contraseña provisional, que la candidatura cambia al entrar. En Ajustes se gestionan todos los usuarios: cambiar el rol, restablecer la contraseña o dar de baja (se queda fuera al momento). Hay tres roles: <b>Administración</b>, <b>Partido</b> (elige lo suyo cuando le toca) y <b>Consulta</b> (solo lectura, por ejemplo para la Junta Electoral de Zona).</p>') +
    hsec(8, 'Importar desde Excel', '<p>Un solo Excel con todo: el programa reconoce cada hoja por su nombre y coloca cada cosa en su sitio: <b>ESPAIS</b> en Espacios, <b>BANDEROLES</b> en Banderolas, <b>PANCARTES</b> en Pancartas, <b>PRISMES</b> en Prismas y <b>PARTITS</b> (siglas, nombre, orden y votos) en Partidos; también lee la lista de partidos que hay junto al cuadrante de la hoja GRAELLA. En Ajustes se puede descargar una <b>plantilla</b> con todas las hojas preparadas. Antes de importar muestra cuántos elementos son nuevos, cuántos se completarán y cuántos ya estaban. <b>Nunca borra ni cambia</b> lo que ya hay ni toca las reservas: solo añade y rellena campos vacíos, así que se puede repetir sin duplicar nada.</p>') +
    hsec(9, 'Editar y campos propios', '<p>Después de importar el Excel, todo se puede corregir. Con «✎ Editar lista» se modifican todos los campos de cada elemento y se añaden o eliminan elementos (uno con reservas no se puede eliminar hasta liberarlas). Si hace falta un dato más (por ejemplo «Aforo» o «Metros»), en «Editar lista» → «Campos propios…» o en Ajustes → «Campos de las listas» se añade como una columna más, también en las candidaturas. Se puede renombrar; quitarlo solo lo oculta, sin borrar los datos.</p>') +
    hsec(10, 'Registro, impresión y exportación', '<p>Cada reserva, liberación, asignación y cambio de turno queda en el <b>Registro</b> con la fecha, la hora y el usuario; no se puede borrar. Los botones «🖨 Imprimir» preparan documentos A4: la hoja de asignaciones de una candidatura («🖨 Imprimir lo elegido por…» en el Panel y en En directo, el menú de impresión o el 🖨 de su fila en Partidos), las de todas, la relación completa de asignaciones, el resultado de cada categoría, el cuadrante de espacios, el reparto con la hoja de conformidad, la ayuda para las candidaturas y el registro. Cada lista tiene también «Exportar (.csv)» para Excel.</p>') +
    hsec(11, 'Copias de seguridad', '<p><b>Todo se guarda solo:</b> cada modificación se guarda al instante y se copia una a una en un almacén de copias separado; el servidor hace una copia completa (datos y usuarios) cada 10 minutos de actividad y antes de eliminar, importar o restaurar, y una copia diaria que no se borra nunca; el navegador de la administración guarda otra copia cada 5 minutos.</p><p><b>Para descargar una copia</b> en el ordenador: botón <b>«💾 Copia»</b> de la cabecera, en cualquier pantalla; también en el Panel y en Ajustes → Copias de seguridad. Al terminar la selección conviene pulsar <b>«Guardar copia permanente…»</b> y ponerle nombre (por ejemplo, «Generales · resultado final»): queda guardada en el servidor para siempre y se descarga a la vez. Desde Ajustes se ven todas las copias y se puede volver a cualquiera sin perder el registro.</p>') +
    hsec(12, 'Seguridad y trabajo simultáneo', '<p>La conexión va cifrada y el servidor solo guarda una huella irreversible de cada contraseña. Tras 5 intentos fallidos el usuario se bloquea 10 minutos y la sesión se cierra tras 30 minutos sin actividad. Todas las reglas (turnos, cupos, exclusividad) las comprueba el servidor, no el navegador. Está probado con más de 20 usuarios conectados y eligiendo a la vez. Los datos viven en el servidor: cambiar de ordenador no borra nada, y las actualizaciones del programa no tocan los datos.</p>');
}

function openModal(html, wide) { const m = $('#modal'); m.innerHTML = '<div class="mc' + (wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' + html + '</div>'; m.hidden = false; const f = m.querySelector('[autofocus]') || m.querySelector('input:not([type=radio]):not([type=checkbox]),select,textarea'); if (f) f.focus(); }
function closeModal(r) { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; if (ST.modalRes) { const f = ST.modalRes; ST.modalRes = null; f(r === undefined ? false : r); } }

    if (o.word) $('#cfWord').addEventListener('input', (e) => { $('#cfYes').disabled = e.target.value.trim().toUpperCase() !== o.word.toUpperCase(); });
  });
}
function download(name, mime, content) { const blob = new Blob([content], { type: mime }), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
const csvq = (s) => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
const csvOut = (name, rows) => download(name, 'text/csv;charset=utf-8', '﻿' + rows.map((r) => r.map(csvq).join(';')).join('\r\n'));
function exportCat(t) {
  const I = idx();
  if (t === 'esp') { const days = campDays(); const rows = [colsOf('esp').map((c) => c[1]).concat(...days.map((d) => [fDMY(d) + ' mañana', fDMY(d) + ' tarde']))]; I.items.esp.forEach((it) => rows.push(colsOf('esp').map((c) => fv(it, c[0])).concat(...days.map((d) => ['M', 'T'].map((m) => { const s = toISO(d) + m, r = activeRes(it.id, s), b = it.nd ? 'nd' : (it.blk || {})[s]; return r ? pName(r.g) : b === 'nd' ? 'No disponible' : b === 'rs' ? 'Con restricciones' : ''; }))))); csvOut('espacios-electorales.csv', rows); return; }
  csvOut(t + '-' + CATN[t].toLowerCase().replace(/\s+/g, '-') + '.csv', [colsOf(t).map((c) => c[1]).concat(['Partido', 'Reservado el', 'Por'])].concat(I.items[t].map((it) => { const r = activeRes(it.id); return colsOf(t).map((c) => fv(it, c[0])).concat(r ? [pName(r.g), fStamp(r.ts), r.by] : it.nd ? ['No disponible' + (it.ndm ? ': ' + it.ndm : ''), '', ''] : ['', '', '']); })));
}

/* ---------- importar el Excel (solo añade y completa; nunca borra ni sobrescribe) ---------- */
const hnorm = (v) => norm(v == null ? '' : String(v)).replace(/[^a-z0-9]+/g, ' ').trim();
const sval = (v) => (v == null ? '' : cellTxt(v).replace(/\s+/g, ' ').trim());
const vval = (v) => { const n = typeof v === 'number' ? v : parseInt(String(v == null ? '' : v).replace(/[.\s]/g, ''), 10); return Number.isFinite(n) && n >= 0 ? Math.min(Math.round(n), 99999999) : null; };
const ival = (v) => { const n = typeof v === 'number' ? v : parseInt(String(v || '').replace(/\./g, ''), 10); return Number.isFinite(n) && n >= 0 ? Math.min(Math.round(n), 9999) : null; };
function sheetKind(name) { const n = hnorm(name); if (/graella|cuadrante|quadrant/.test(n)) return 'grid'; if (/partit|partido|candidatur|formaci/.test(n)) return 'par'; if (/espais|espacios/.test(n)) return 'esp'; if (/banderol/.test(n)) return 'ban'; if (/pancart/.test(n)) return 'pan'; if (/prism|columnes|columnas/.test(n)) return 'pri'; return null; }
function headerRow(sh, test, min) { for (let r = 0; r < Math.min(sh.rows.length, 15); r++) { const hs = sh.rows[r].map(hnorm); if (hs.filter((h) => h && test(h)).length >= (min || 2)) return r; } return -1; }
function colOf(sh, hr, re) { const hs = sh.rows[hr].map(hnorm); for (let c = 0; c < hs.length; c++) if (hs[c] && re.test(hs[c])) return c; return -1; }
function parseWorkbook(sheets) {
  const out = { esp: [], ban: [], pan: [], pri: [], par: [], sheets: [] }, g = (row, c) => (c >= 0 ? row[c] : null), grids = [];
  const addX = (T, sh, hr, row, o) => { const X = xfOf(T).map((d) => [d.id, colOf(sh, hr, new RegExp('^' + hnorm(d.n).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$'))]).filter((x) => x[1] >= 0); if (X.length) { o.xv = {}; X.forEach(([id, col]) => { const v = sval(row[col]); if (v) o.xv[id] = v; }); } return o; };
  sheets.forEach((sh) => {
    const T = sheetKind(sh.name); if (!T) return;
