# Pasa la batería de pruebas de Espais electorals en cada cambio que se sube a GitHub.
# Usa un servidor de pruebas con el almacén vacío: nunca toca los datos reales de Netlify.
name: Pruebas
on:
  push:
    branches: [main, desarrollo]
  pull_request:
  workflow_dispatch:
jobs:
  pruebas:
    # Ubuntu 24.04 fijo: desde noviembre de 2026 «ubuntu-latest» es la 26.04 y Playwright 1.56.1 no instala Chromium en ella
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias
        run: npm ci
      - name: Navegador y lector de PDF para las pruebas
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Reglas del servidor, interfaz y carga con 50 usuarios
        run: bash pruebas/ejecutar.sh --carga
